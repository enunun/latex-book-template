# 開発用コンテナと同じイメージで，整形の検査とビルドを行う．
# タグをpushしたときは，ビルドしたPDFをReleaseに添付する．
name: Build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build dev container image
        run: docker compose -f .devcontainer/compose.yml build

      # Markdownのリント(lint:docs)は，pnpm-lock.yamlをコミットしてから加える．
      - name: Check formatting and build PDF
        run: >-
          docker compose -f .devcontainer/compose.yml run --rm app
          sh -c "mise run lint:tex && mise run build"

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: src/main.pdf

      - name: Release PDF
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src/main.pdf
