[tools]
rtk = "0.49.0"
lefthook = "2.1.14"
node = "26.10.0"
pnpm = "12.6.0"
# TeX Live(lualatex，llmk，latexindentなど)はmiseではなく，Dockerイメージに含まれるものを使う．
# 版を固定する場合はここで`mise lock`を実行し，生成されたmise.lockもコミットする．

# 実際に利用する場合には以下を有効にする
# [settings]
# lockfile = true

[tasks.install]
description = "依存パッケージをインストールする"
run = "pnpm install --frozen-lockfile"

[tasks.build]
description = "原稿をビルドしてsrc/main.pdfを作る(手順はsrc/llmk.toml)"
dir = "src"
run = "llmk"

[tasks.clean]
description = "ビルドで生成したファイルを削除する(PDFも含む)"
# src/の下で.gitignoreが除外しているファイルは，すべてビルドの生成物である．
run = "git clean -fX -- src"

[tasks.fmt]
description = "TeXのソースをlatexindentで整形する"
run = [
	"mkdir -p .cache/latexindent",
	"git ls-files -z '*.tex' | xargs -0 -r latexindent --overwriteIfDifferent --silent --local=.latexindent.yaml --cruft=.cache/latexindent/ --logfile=/dev/null",
]

[tasks."lint:tex"]
description = "TeXのソースがlatexindentで整形済みかを検査する"
run = [
	"mkdir -p .cache/latexindent",
	"git ls-files -z '*.tex' | xargs -0 -r latexindent --check --local=.latexindent.yaml --cruft=.cache/latexindent/ --logfile=/dev/null > /dev/null || { echo 'latexindentで整形されていないファイルがある．mise run fmtを実行すること．' >&2; exit 1; }",
]

[tasks."lint:docs"]
description = "原稿(.tex)の文章とMarkdownの文書をtextlintで，Markdownの書式をmarkdownlintで検査する"
depends = ["install"]
run = "pnpm lint"

[tasks.lint]
description = "すべてのリントを実行する"
depends = ["lint:tex", "lint:docs"]

[tasks."lint:nag"]
description = "時代遅れの命令や環境を使っていないかを，ビルドのログのnagの警告で検査する"
depends = ["build"]
dir = "src"
run = "if grep -A2 'Package nag Warning' main.log; then echo '時代遅れの命令や環境がある．上のnagの警告に従って書き換えること．' >&2; exit 1; fi"

[tasks.hooks]
description = "Gitのフック(コミット時の検査)を設定する"
run = "lefthook install"

[tasks.setup]
description = "開発環境を整える(依存パッケージ，Gitのフックなど)"
depends = ["install", "hooks"]

[tasks.check]
description = "整形の検査，リント，ビルド，nagの検査をまとめて実行する(CIと同じ)"
depends = ["lint", "lint:nag"]
